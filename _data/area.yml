meta:
  name: Agent Skills
  description: An index and topic collection covering Agent Skills, the packaged,
    file-based capability units that AI coding agents load to extend their behavior.
    Agent Skills bundle instructions, scripts, schemas, and reference material into
    directories that agents discover, plan against, and execute at runtime, giving
    organizations a portable way to govern how AI assistants interact with their products
    and APIs. This collection tracks vendor-published skill repositories (Claude Code
    skills, Claude Agent SDK skills, Cursor rules, OpenAI Apps SDK skills, and capability
    packages) shipped by API providers across developer tools, data platforms, SaaS,
    and infrastructure.
  tags:
  - Agent Skills
  - Claude Skills
  - Capability Packages
  - AI Agents
  - Developer Tooling
  portal: https://apievangelist.com
  github: https://github.com/api-evangelist
  repo: agents-skills

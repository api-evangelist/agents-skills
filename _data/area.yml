features:
- name: File-Based Capability Packaging
  description: Agent Skills bundle markdown instructions, executable scripts, schemas,
    and reference material into versioned directories that agents can load deterministically
    at runtime.
- name: Vendor-Published Skill Repositories
  description: API providers ship official GitHub repositories such as resend-skills,
    ngrok/agent-skills, postman-skills, and jfrog-skills to deliver first-party automation
    behavior for their products.
- name: Progressive Disclosure of Context
  description: Skills surface a short SKILL.md frontmatter for discovery, then load
    deeper instructions, scripts, and assets only when an agent activates them, keeping
    token usage low.
- name: Agent-Executable Tooling
  description: Skills package shell, Python, or Node scripts alongside instructions
    so agents can perform multi-step work (auth, file generation, API calls) instead
    of relying on prose-only prompting.
- name: Multi-Runtime Compatibility
  description: Skill formats are emerging across Claude Code, Claude Agent SDK, Cursor,
    OpenAI Apps SDK, and Gemini, with vendors publishing parallel skill sets for each
    runtime.
- name: Skill Discovery and Governance
  description: Organizations curate skill catalogs, sign skill manifests, and gate
    skill activation through allow lists so AI agents only run vetted capability packages.
- name: API-First Skill Generation
  description: Skills are increasingly generated from OpenAPI, AsyncAPI, and APIs.json
    descriptions so each API operation becomes a callable, governed capability inside
    an agent.
- name: Open Skill Ecosystem
  description: A growing ecosystem of community-maintained skill registries and indexes
    complements vendor repos, mirroring how the npm and PyPI ecosystems formed around
    packages.
use_cases:
- name: First-Party Product Skills
  description: SaaS vendors ship official skill repos so AI agents in Claude Code
    or Cursor can create resources, run reports, and operate their products without
    bespoke prompt engineering.
- name: Internal Developer Platform Skills
  description: Platform teams package their CI/CD, deployment, and observability workflows
    as governed skills so every engineering agent uses the same approved automations.
- name: API Onboarding and Education
  description: API providers use skills to walk agents through authentication, sandbox
    setup, and "hello world" requests, accelerating time-to-first-call for developer-led
    agents.
- name: Governed Capability Distribution
  description: Compliance-sensitive organizations distribute skills with allow-lists,
    signing, and audit trails to ensure only approved AI behaviors run against production
    systems.
- name: API Specification to Skill Pipelines
  description: Teams convert OpenAPI specs into skill bundles (one operation per tool)
    so agents get typed, governed access to every endpoint without writing custom
    wrappers.
- name: Cross-Runtime Skill Portability
  description: Vendors maintain mirror skill sets for Claude, Cursor, and OpenAI Apps
    SDK, giving customers a consistent experience across whichever coding agent they
    choose.
- name: Skill-Driven Customer Support
  description: Support and DevRel teams publish skills that diagnose common issues,
    pull logs, and open tickets, letting customer-side agents resolve problems autonomously.
- name: Sandbox and Test Environment Skills
  description: Skill bundles provision throwaway environments, seed test data, and
    tear down resources so agents can exercise APIs safely during development and
    CI.
integrations:
- name: Claude Code
  description: Anthropic's official coding agent loads skills from the .claude/skills
    directory and surfaces them as plan-then-execute capabilities.
- name: Claude Agent SDK
  description: The Claude Agent SDK lets developers embed skill loading and execution
    into their own agent harnesses with the same SKILL.md contract as Claude Code.
- name: Cursor
  description: Cursor consumes vendor rules and skill-style instruction bundles to
    extend its in-editor coding agent with provider-specific behavior.
- name: OpenAI Apps SDK
  description: The OpenAI Apps SDK provides a skill-equivalent surface so apps and
    agents on the OpenAI platform can ship packaged capabilities to ChatGPT and developer
    tools.
- name: Google Gemini
  description: Gemini's GEMINI.md and skill-style instruction files let vendors target
    Google's coding agent surface alongside Claude and Cursor.
- name: GitHub
  description: GitHub hosts the canonical distribution channel for skill repositories,
    including vendor-published agent-skills, claude-skills, and *-skills repos.
- name: Postman
  description: Postman's skill repository ships first-party capabilities for working
    with Postman collections, workspaces, and the Postman API from coding agents.
- name: Anthropic
  description: Anthropic publishes the SKILL.md format, reference skill repositories,
    and the Skills feature in Claude Code that anchors the broader ecosystem.
